services:
  database:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Copy .env.docker.example to .env and set the passwords}
      MYSQL_DATABASE: fogo
      MYSQL_USER: ${MYSQL_USER:?Set MYSQL_USER in .env}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_0900_ai_ci"]
    ports:
      - "${MYSQL_PUBLISHED_PORT:-3307}:3306"
    volumes:
      - fogo_mysql_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./database/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$${MYSQL_ROOT_PASSWORD}\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  database-migrate:
    image: mysql:8.0
    restart: "no"
    environment:
      MYSQL_DATABASE: fogo
      MYSQL_USER: ${MYSQL_USER:?Set MYSQL_USER in .env}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
      EQUIPMENT_CATALOG_MIGRATION_REVISION: "3"
    volumes:
      - ./database/migrate_active_trips.sql:/migration.sql:ro
      - ./database/migrate_equipment_catalog.sql:/equipment-catalog-migration.sql:ro
      - ./database/migrate_location_addresses.sql:/location-addresses-migration.sql:ro
    entrypoint: ["/bin/sh", "-c"]
    command: ["mysql --default-character-set=utf8mb4 --protocol=tcp --host=database --user=\"$$MYSQL_USER\" --password=\"$$MYSQL_PASSWORD\" \"$$MYSQL_DATABASE\" < /migration.sql && mysql --default-character-set=utf8mb4 --protocol=tcp --host=database --user=\"$$MYSQL_USER\" --password=\"$$MYSQL_PASSWORD\" \"$$MYSQL_DATABASE\" < /equipment-catalog-migration.sql && mysql --default-character-set=utf8mb4 --protocol=tcp --host=database --user=\"$$MYSQL_USER\" --password=\"$$MYSQL_PASSWORD\" \"$$MYSQL_DATABASE\" < /location-addresses-migration.sql"]
    depends_on:
      database:
        condition: service_healthy

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      MYSQL_HOST: database
      MYSQL_PORT: 3306
      MYSQL_DATABASE: fogo
      MYSQL_USER: ${MYSQL_USER:?Set MYSQL_USER in .env}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
      CORS_ORIGINS: http://localhost:${FRONT_PUBLISHED_PORT:-8081},http://127.0.0.1:${FRONT_PUBLISHED_PORT:-8081}
    ports:
      - "${API_PUBLISHED_PORT:-8000}:8000"
    depends_on:
      database-migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  front:
    build:
      context: ./front
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${FRONT_PUBLISHED_PORT:-8081}:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  fogo_mysql_data:
